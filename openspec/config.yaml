schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Стор «Мои приложения» — статический сайт-каталог готовых приложений
  владельца для скачивания. Отдельный репозиторий dziominpavel.github.io,
  хостинг GitHub Pages, деплой через GitHub Actions (cron-синхронизация).
  Витрина — релизный трек: version, тег vX.Y.Z, GitHub Release.
  Контракт данных: приложения хранят store.yaml + screenshots/ + version
  и публикуют артефакты в GitHub Releases; стор читает их и генерит статику
  (Python, без фреймворков). Приложения о сторе не знают. Всё бесплатно,
  без платных сервисов, только русский язык витрины.
  Потребители контракта (пилот): FogMap; остальные — 6 репозиториев
  под owner dziominpavel.

  Ключевые файлы контракта в потребителях: store.yaml (name, description,
  icon [обязательна], requirements [опц.]), screenshots/ (0–5, опционально,
  единый размер), version (MAJOR.MINOR.PATCH), dist/ (gitignored, staging).
  В сторе: registry.yaml (список репозиториев, ключ = слаг [a-z0-9-]),
  templates/, static/, generate.py.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

rules:
  specs:
    - "Текст requirements и сценариев — русский"
    - "В каждом ### Requirement: обязательно MUST, SHALL или MUST NOT (не «ДОЛЖЕН»)"
    - "Main spec (openspec/specs/): секции ## Purpose и ## Requirements"
    - "Delta spec (openspec/changes/*/specs/): ## ADDED/MODIFIED/REMOVED Requirements"
    - "Каждый requirement — минимум один #### Scenario: с WHEN/THEN"
    - "Capability = подсистема, не отдельная фича"
    - "После правок запускать openspec validate --all"
  proposal:
    - "Русский язык, кратко: что и зачем"
  design:
    - "Русский язык: как реализовать, trade-offs"
  tasks:
    - "Русский язык, чекбоксы - [ ] / - [x]"
