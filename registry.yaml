# Реестр проектов витрины «Мои приложения».
# Ключ записи — слаг страницы приложения (/[key]/), паттерн [a-z0-9-].
# Добавление приложения = одна запись здесь (при выполненном контракте в его репо).
projects:
  fogmap:
    repo: dziominpavel/FogMap
  yandex-music-downloader:
    repo: dziominpavel/YandexMusicDownloader
  instagram-tracker:
    repo: dziominpavel/InstagramTracker
  charge-forecast:
    repo: dziominpavel/ChargeForecast
  gym-progress:
    repo: dziominpavel/GymProgress
  voice-mind:
    repo: dziominpavel/VoiceMind
  wishlot:
    repo: dziominpavel/Wishlot

# Веб-приложения: статика публикуется на /apps/<slug>/ — из папки web/
# репозитория-источника или из результата команды сборки `build` (каталог
# вывода передаётся ей аргументом --out). Без release/version/скриншотов —
# только repo/title/description (+ опционально data и build).
web:
  benchmark:
    repo: dziominpavel/Benchmark
    title: Benchmark
    description: "ELO-рейтинг языковых моделей под мои задачи: качество определяется на примере приложения VoiceMind (задача T-001 — поиск багов). Полный слепок консоли — рейтинг, история, аналитика, настройки — в браузере, только просмотр."
    build: python tools/export_web.py  # полный read-only слепок консоли (change static-mirror-export)
    data: data/index.json  # копируется рядом со страницей; дата карточки — из updated
  instagram-tracker:
    repo: dziominpavel/InstagramTracker
    title: InstagramTracker Web
    description: "Анализ экспорта Instagram в браузере: подписчики, взаимные и динамика списков — данные не покидают устройство."
